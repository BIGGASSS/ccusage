name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # No path filter: docs-only changes must also pass the flake checks.
  preflight:
    name: Security and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - name: Secret scan, workflow lint, and repository scan
        run: >-
          nix build --print-build-logs
          .#checks.x86_64-linux.gitleaks
          .#checks.x86_64-linux.treefmt
          .#checks.x86_64-linux.tirith

  test:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      # Includes Rust, Node, performance harness, and installed npm smoke tests.
      - name: Run all flake checks
        run: nix flake check --print-build-logs

  build-npm-packages:
    needs: preflight
    name: npm-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: linux-arm64
            package: npm-tarballs
            binary-package: ccusage-static
            launcher: 'false'
          - os: ubuntu-latest
            target: linux-x64
            package: npm-tarballs
            binary-package: ccusage-static
            launcher: 'true'
          - os: macos-15
            target: darwin-arm64
            package: npm-tarballs
            binary-package: ccusage
            launcher: 'false'
          - os: macos-15
            target: darwin-x64
            package: npm-darwin-x64
            binary-package: ccusage-darwin-x64
            launcher: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-npm-packages
        with:
          package: ${{ matrix.package }}
          target: ${{ matrix.target }}
          binary-package: ${{ matrix.binary-package }}
          launcher: ${{ matrix.launcher }}

  ci-gate:
    name: ci gate
    needs: [preflight, test, build-npm-packages]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
