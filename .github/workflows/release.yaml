name: tagpr

# Releases are opt-in for this fork; ordinary pushes never create release PRs
# or publish packages. Dispatch again after merging a release PR to publish.
on:
  workflow_dispatch:

concurrency: tagpr

permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      # tagpr must be able to push the release PR and tag on the release branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix-cache
      - id: tagpr
        # The CLI writes tag=<version> to GITHUB_OUTPUT only when it tags.
        run: nix run .#tagpr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GITHUB_TOKEN-created tags do not trigger another workflow. Every job below
  # checks out the emitted tag, not a potentially newer main. To retry a failed
  # release, re-run failed jobs only; a full re-run may not emit a new tag.
  checks:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - run: nix flake check --print-build-logs

  build-npm-packages:
    name: npm-${{ matrix.target }}
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: linux-arm64
            package: npm-tarballs
            binary-package: ccusage-static
            launcher: 'false'
          - os: ubuntu-latest
            target: linux-x64
            package: npm-tarballs
            binary-package: ccusage-static
            launcher: 'true'
          - os: macos-15
            target: darwin-arm64
            package: npm-tarballs
            binary-package: ccusage
            launcher: 'false'
          - os: macos-15
            target: darwin-x64
            package: npm-darwin-x64
            binary-package: ccusage-darwin-x64
            launcher: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/build-npm-packages
        with:
          package: ${{ matrix.package }}
          target: ${{ matrix.target }}
          binary-package: ${{ matrix.binary-package }}
          launcher: ${{ matrix.launcher }}

  npm:
    needs: [tagpr, checks, build-npm-packages]
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ccusage-npm-*
          path: ${{ runner.temp }}/npm-tarballs
          merge-multiple: true
      - name: Publish the exact checked tarballs with pinned npm and OIDC
        run: nix run .#npm-publish -- "$RUNNER_TEMP/npm-tarballs"

  release:
    needs: [tagpr, npm]
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # changelogithub resolves the release tag with git tag --points-at HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - run: nix run .#changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
